name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in MacDeck
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: What version of macOS are you using? (e.g., macOS 14.5 Sonoma)
      placeholder: macOS 14.5
    validations:
      required: true
  - type: input
    id: macdeck_version
    attributes:
      label: MacDeck Version
      description: What version of MacDeck are you using?
      placeholder: v1.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      value: |
        1. Open MacDeck
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any console outputs or attach screenshots if applicable.
